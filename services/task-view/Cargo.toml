[package]
name = "merezha-task-view"
description = "Task board read model and queries as a Merezha application projection (example service)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "task_view"
crate-type = ["cdylib", "rlib"]

[dependencies]
merezha-domain.workspace = true
merezha-task-events.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[features]
# Builds a faulty revision that fails every batch containing `TaskRenamed`
# with a transient failure, used to demonstrate that a failed catch-up keeps
# the checkpoint and that a replaced component resumes from it.
faulty = []
