[package]
name = "merezha-componentize"
description = "Turns a Merezha service core module into an import-free component and checks it against the canonical WIT"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.58"
wit-component = "0.262.0"
wit-parser = "0.262.0"

[dev-dependencies]
wit-component = { version = "0.262.0", features = ["dummy-module"] }
