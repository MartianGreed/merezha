[package]
name = "merezha-componentize"
description = "Turns a Merezha service core module into an import-free component and checks it against the canonical WIT"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The componentizer and its contract checks live in the host workspace
# (scaffold SC-S1), shared with `merezha componentize` and `merezha build`.
merezha-guest-build = { path = "../../crates/guest-build" }
