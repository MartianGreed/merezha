[package]
name = "merezha-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
merezha-domain = { path = "../domain" }
merezha-runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
merezha-postgres = { path = "../postgres", optional = true }
# Dispatch and projection telemetry (TE §1.2, §1.3, §2.2): the APIs, the
# name catalog and `propagation` for stored contexts and span links; never
# the SDK.
merezha-telemetry = { path = "../telemetry", features = ["propagation"] }
opentelemetry.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
# The lag sampler and the PostgreSQL store's runtime handle.
tokio.workspace = true

[features]
# PostgreSQL storage (`merezha_application::postgres`), on in `merezha-cli`.
postgres = ["dep:merezha-postgres"]
# Hidden hooks for the store contract tests (`tests/store_contract.rs`):
# a second instance over the same durable data.
test-support = []

[dev-dependencies]
merezha-application = { path = ".", features = ["test-support", "postgres"] }
merezha-postgres = { path = "../postgres" }
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk.workspace = true
tokio.workspace = true
tempfile.workspace = true
wat.workspace = true
