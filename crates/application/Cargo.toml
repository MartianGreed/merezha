[package]
name = "merezha-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
merezha-domain = { path = "../domain" }
merezha-runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
merezha-postgres = { path = "../postgres", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# PostgreSQL storage (`merezha_application::postgres`), on in `merezha-cli`.
postgres = ["dep:merezha-postgres", "dep:tokio", "dep:tracing"]
# Hidden hooks for the store contract tests (`tests/store_contract.rs`):
# a second instance over the same durable data.
test-support = []

[dev-dependencies]
merezha-application = { path = ".", features = ["test-support", "postgres"] }
merezha-postgres = { path = "../postgres" }
tokio.workspace = true
tempfile.workspace = true
wat.workspace = true
