[package]
name = "merezha-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test hooks (`testing`): only this crate's own dev-dependency enables
# them; release builds never do.
test-hooks = []

[dependencies]
merezha-blob = { path = "../blob" }
merezha-domain = { path = "../domain" }
merezha-platform = { path = "../platform" }
merezha-postgres = { path = "../postgres" }
merezha-telemetry = { path = "../telemetry" }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
deunicode.workspace = true
futures-util.workspace = true
imagesize.workspace = true
infer.workspace = true
jiff.workspace = true
regex.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# The integration tests pause real writes (`testing::pause_next_write`).
merezha-content = { path = ".", features = ["test-hooks"] }
merezha-application = { path = "../application" }
merezha-jobs = { path = "../jobs" }
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
tower.workspace = true
