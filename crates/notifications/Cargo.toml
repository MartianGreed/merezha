[package]
name = "merezha-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test kit (NT §8): named crash points for the duplicate-delivery tests,
# `testkit::FakeBrevo`, `testkit::FakePushService`, `testkit::TestResolver`
# and `testkit::WebhookReceiver`.
# Dev-dependencies only; release builds never enable it.
testkit = []

[dependencies]
# Webhook secrets at rest (NT §5.5); 0.10 shares the tree with web-push-native.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
merezha-domain = { path = "../domain" }
merezha-platform = { path = "../platform" }
merezha-postgres = { path = "../postgres" }
merezha-telemetry = { path = "../telemetry" }
axum.workspace = true
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
futures-core.workspace = true
hmac.workspace = true
jiff.workspace = true
minijinja = { version = "3.0.3", default-features = false, features = ["builtins", "macros", "multi_template", "fuel", "urlencode"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
opentelemetry.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-jiff-0_2", "with-serde_json-1"] }
toml.workspace = true
tracing.workspace = true
url = "2.5.8"
web-push-native = "0.5.0"
# Wipes decrypted webhook secrets on drop; already in the tree (RustCrypto).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
merezha-notifications = { path = ".", features = ["testkit"] }
merezha-jobs = { path = "../jobs", features = ["test-hooks"] }
merezha-application = { path = "../application" }
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
tempfile.workspace = true
tower.workspace = true
