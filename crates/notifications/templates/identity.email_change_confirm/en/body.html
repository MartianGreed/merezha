{% extends "_layouts/email.html" %}
{% block content %}
<p>Hello{% if recipient.name %} {{ recipient.name }}{% endif %},</p>
<p>Open this link to use this address for your {{ app.name }} account:</p>
<p><a href="{{ secret.link | url }}" style="display:inline-block;padding:10px 16px;background:#1c1917;color:#ffffff;border-radius:6px;text-decoration:none">Confirm my new address</a></p>
<p>If you did not ask for this change, you can ignore this email.</p>
{% endblock %}
