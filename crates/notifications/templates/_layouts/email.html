<!doctype html>
<html lang="{{ recipient.locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app.name }}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f4;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1c1917;line-height:1.5">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px">
{% block content %}{% endblock %}
</div>
<p style="max-width:560px;margin:16px auto 0;font-size:12px;color:#78716c">{{ app.name }}{% if links.unsubscribe %} &middot; <a href="{{ links.unsubscribe }}" style="color:#78716c">{% block unsubscribe %}Unsubscribe{% endblock %}</a>{% endif %}</p>
</body>
</html>
