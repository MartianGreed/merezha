{% extends "_layouts/email.html" %}
{% block content %}
<p>Hello{% if recipient.name %} {{ recipient.name }}{% endif %},</p>
<p>Confirm your email address for {{ app.name }} by opening this link:</p>
<p><a href="{{ secret.link | url }}" style="display:inline-block;padding:10px 16px;background:#1c1917;color:#ffffff;border-radius:6px;text-decoration:none">Confirm my email address</a></p>
<p>If you did not create an account, you can ignore this email.</p>
{% endblock %}
