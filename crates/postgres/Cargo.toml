[package]
name = "merezha-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
merezha-domain = { path = "../domain" }
# `propagation` (no SDK): DB spans parent only on a span the bridge records.
merezha-telemetry = { path = "../telemetry", features = ["propagation"] }
opentelemetry.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk.workspace = true
tempfile.workspace = true
# The workspace statement scan parses sources (tests/statement_scan.rs);
# `span-locations` gives its findings their line numbers.
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
# `cargo metadata` output: where the locked driver sources are.
serde_json.workspace = true
