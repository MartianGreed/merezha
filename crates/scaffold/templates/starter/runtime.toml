# The runtime manifest: the guest components and their limits.
# merezha build writes components/<id>.wasm from the package named <id>.
version = 1

[limits]
memory_bytes = 16777216
fuel = 200000000
max_input_bytes = 262144
max_output_bytes = 262144
timeout_ms = 2000
max_concurrent_invocations = 16   # at least limits.max_concurrent 8 + background 2

[[services]]
id = "domain"
path = "components/domain.wasm"
application_protocol = 2

[[services]]
id = "view"
path = "components/view.wasm"
application_protocol = 2

[[services]]
id = "notifier"
path = "components/notifier.wasm"
application_protocol = 2
