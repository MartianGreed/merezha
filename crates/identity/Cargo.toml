[package]
name = "merezha-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# WebAuthn passkeys (identity section 6). `webauthn-rs` pulls OpenSSL, built
# vendored, so a build without passkeys has no OpenSSL; the prebuilt host
# enables it.
passkeys = ["dep:webauthn-rs", "dep:openssl"]

[dependencies]
merezha-application = { path = "../application" }
merezha-domain = { path = "../domain" }
merezha-platform = { path = "../platform" }
merezha-postgres = { path = "../postgres" }
merezha-telemetry = { path = "../telemetry" }
argon2.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
idna.workspace = true
jiff.workspace = true
miniz_oxide.workspace = true
oauth2.workspace = true
openidconnect.workspace = true
openssl = { workspace = true, optional = true }
opentelemetry.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-jiff-0_2", "with-serde_json-1"] }
tracing.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
webauthn-rs = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
merezha-jobs = { path = "../jobs" }
# Test-only signing keys of the mock OIDC provider.
openssl.workspace = true
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
tempfile.workspace = true
tower.workspace = true
webauthn-authenticator-rs.workspace = true
