[package]
name = "merezha-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "merezha"
path = "src/main.rs"

[dependencies]
merezha-application = { path = "../application" }
merezha-domain = { path = "../domain" }
merezha-runtime = { path = "../runtime" }
merezha-platform = { path = "../platform" }
merezha-jobs = { path = "../jobs" }
anyhow.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The process tests drive the relay through MEREZHA_JOBS_TEST_RELAY.
merezha-jobs = { path = "../jobs", features = ["test-hooks"] }
merezha-postgres = { path = "../postgres" }
tempfile.workspace = true
wat.workspace = true
tower.workspace = true
