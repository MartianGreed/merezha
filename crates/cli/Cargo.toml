[package]
name = "merezha-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "merezha"
path = "src/main.rs"

[dependencies]
merezha-application = { path = "../application", features = ["postgres"] }
merezha-domain = { path = "../domain" }
merezha-guest-build = { path = "../guest-build" }
merezha-runtime = { path = "../runtime" }
merezha-scaffold = { path = "../scaffold" }
merezha-platform = { path = "../platform" }
merezha-jobs = { path = "../jobs" }
merezha-notifications = { path = "../notifications" }
merezha-content = { path = "../content" }
merezha-identity = { path = "../identity", features = ["passkeys"] }
merezha-postgres = { path = "../postgres" }
merezha-telemetry = { path = "../telemetry", features = ["pipeline"] }
anyhow.workspace = true
base64.workspace = true
serde_json.workspace = true
axum.workspace = true
jiff.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing = { workspace = true, features = ["release_max_level_debug"] }

[dev-dependencies]
# `RunHooks::reactor_fail` for the reactor rollback tests.
merezha-application = { path = "../application", features = ["postgres", "test-support"] }
# The process tests drive the relay through MEREZHA_JOBS_TEST_RELAY.
merezha-jobs = { path = "../jobs", features = ["test-hooks"] }
# `testkit::FakeBrevo` for `merezha notifications brevo register-webhook`.
merezha-notifications = { path = "../notifications", features = ["testkit"] }
merezha-telemetry = { path = "../telemetry", features = ["testing"] }
tempfile.workspace = true
# tests/new.rs reads the generated TOML.
toml.workspace = true
wat.workspace = true
# tests/statement_registry.rs reads the statement constants each crate declares.
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
tower.workspace = true
