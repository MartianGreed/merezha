[workspace]
members = [
    "crates/runtime",
    "crates/cli",
    "crates/domain",
    "crates/application",
    "crates/postgres",
    "crates/platform",
    "crates/content",
    "crates/jobs",
    "crates/notifications",
    "crates/blob",
    "crates/telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.12"
wasmparser = "=0.258.3"
wasmtime = { version = "=49.0.3", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tempfile = "3.27.0"
wat = "1.258.3"
tower = { version = "0.5.3", features = ["util"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits", "fallible_uint"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
http-body-util = "0.1.5"
sha2 = { version = "0.11.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde", "tz-system", "tzdb-bundle-always"] }
uuid = { version = "1.29.0", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
deunicode = { version = "1.6.2", default-features = false, features = ["alloc"] }
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "internal-logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "gzip-http", "grpc-tonic", "tls-aws-lc", "tls-roots", "gzip-tonic"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry-semantic-conventions = "0.33.1"
tracing-appender = "0.2.5"
libc = "0.2.191"

[profile.dev]
debug = 0

[profile.test]
debug = 0
