# Invalid on purpose: the pipeline names a service that does not exist.
# The host must reject this reload and keep serving the previous registry.
version = 1

[limits]
memory_bytes = 16777216
fuel = 200000000
max_input_bytes = 262144
max_output_bytes = 524288
timeout_ms = 2000
max_concurrent_invocations = 8

[[services]]
id = "greet"
path = "components/greeting-formal.wasm"

[[services]]
id = "envelope"
path = "components/json-envelope.wasm"

[[pipelines]]
id = "welcome"
steps = ["greet", "translate", "envelope"]
